<style>
:root{--bg:#14110f;--card:#1f1a17;--gold:#c8a26b;--tx:#efe7da;--mu:#a89c8b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font-family:Tajawal,sans-serif}
.hero{height:70vh;background:linear-gradient(#0008,#14110f),var(--hero) center/cover;display:flex;flex-direction:column;justify-content:flex-end;padding:24px}
h1{font-family:'Cormorant Garamond',serif;font-size:40px;margin:0;color:var(--gold)}
.hero p{color:var(--mu)}
.btn{background:var(--gold);color:#1a1209;border:0;border-radius:12px;padding:12px 18px;font:700 16px Tajawal;cursor:pointer;display:inline-block;text-decoration:none}
section{padding:28px 18px}h2{font-family:'Cormorant Garamond',Tajawal,serif;color:var(--gold);font-size:30px;margin:0 0 14px}
.tabs{display:flex;gap:8px;margin-bottom:14px;overflow:auto}.tab{padding:8px 16px;border-radius:20px;border:1px solid var(--gold);background:none;color:var(--gold);font:500 15px Tajawal;white-space:nowrap}.tab.on{background:var(--gold);color:#1a1209}
.item{display:flex;gap:12px;background:var(--card);border-radius:16px;padding:10px;margin-bottom:12px;align-items:center}
.item img{width:84px;height:84px;border-radius:12px;object-fit:cover}.item .i{flex:1}.item h3{margin:0 0 4px;font-size:18px}.item small{color:var(--mu)}
.pr{color:var(--gold);font-weight:700;margin-top:4px}
.qty{display:flex;align-items:center;gap:8px}.qty button{width:32px;height:32px;border-radius:50%;border:1px solid var(--gold);background:none;color:var(--gold);font-size:18px}
#bar{position:fixed;bottom:0;left:0;right:0;padding:12px 16px;background:#000d;backdrop-filter:blur(8px);display:none;justify-content:space-between;align-items:center;z-index:5}
#modal{position:fixed;inset:0;background:#000b;display:none;align-items:flex-end;z-index:9}
#modal .box{background:var(--card);width:100%;border-radius:22px 22px 0 0;padding:20px;max-height:92vh;overflow:auto}
input,textarea,select{width:100%;padding:12px;margin:6px 0;border-radius:10px;border:1px solid #3a322b;background:#14110f;color:var(--tx);font:16px Tajawal}
.row{display:flex;justify-content:space-between;padding:4px 0}.tot{font-weight:700;color:var(--gold);font-size:20px}
table{width:100%;font-size:13px;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid #3a322b;text-align:right}
footer{text-align:center;color:var(--mu);padding:30px 0 90px;font-size:13px}

:root{--glass:rgba(255,248,235,.08)}
body{background:radial-gradient(1200px 600px at 20% -10%,#3a2a1d 0,transparent 60%),#100d0b}
.hero{position:relative;min-height:min(100svh,820px);height:auto;overflow:hidden;display:flex;align-items:flex-end;padding:0;background:linear-gradient(180deg,#0b080666 0,#100d0bcc 70%,#100d0b 100%),var(--hero2) center/cover no-repeat}
@keyframes kb{from{background-size:100%}to{background-size:112%}}
.hc{position:relative;z-index:2;padding:28px 22px 40px;max-width:760px;margin:0 auto;text-align:center;animation:up 1.2s both}
@keyframes up{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:none}}
.brand{letter-spacing:3px;color:var(--gold);font-size:13px;margin-bottom:14px}
h1{font-family:'Cormorant Garamond',serif;font-weight:600;font-size:clamp(46px,13vw,104px);line-height:.95;color:#fff;margin:0 0 14px;direction:ltr;text-align:center;text-shadow:0 4px 30px #000a}
.hero p{font-size:18px;color:#e8dccb}
.cta{border-radius:40px;padding:15px 28px;box-shadow:0 8px 30px #c8a26b55;margin-top:6px}
.glass{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid #ffffff22;border-radius:18px}
.hours{display:inline-flex;text-align:center;flex-direction:column;gap:4px;padding:12px 18px;margin-top:22px}.hours b{color:var(--gold);font-size:13px;letter-spacing:1px}
.beans i{position:absolute;bottom:-40px;width:calc(22px*var(--s));height:calc(32px*var(--s));border-radius:50%;background:radial-gradient(circle at 35% 30%,#7a4a2a,#2a170c);box-shadow:inset -2px -3px 5px #0008;animation:fl linear infinite;opacity:.85;z-index:1}
.beans i:after{content:"";position:absolute;left:48%;top:8%;bottom:8%;width:2px;background:#0009;border-radius:2px;transform:rotate(12deg)}
@keyframes fl{0%{transform:translateY(0) rotate(0)}100%{transform:translateY(-110vh) rotate(360deg)}}
section{max-width:900px;margin:auto}
h2{font-family:'Cormorant Garamond',Tajawal,serif;font-size:34px}
.item{background:var(--glass);backdrop-filter:blur(10px);border:1px solid #ffffff1c;border-radius:20px;padding:12px;transition:transform .25s}
.item:hover{transform:translateY(-3px)}
.item img{width:96px;height:96px;border-radius:16px}
@media(min-width:760px){#list{display:grid;grid-template-columns:1fr 1fr;gap:14px}.item{margin:0}}
@media(prefers-reduced-motion:reduce){.hero,.hc,.beans i{animation:none}}

const cats=[...new Set(MENU.map(m=>m.c))];let cat=cats[0],cart={};

function render(){ $('tabs').innerHTML=cats.map(c=>`<button class="tab ${c==cat?'on':''}" onclick="cat='${c}';render()">${c}</button>`).join('');

$('cnt').textContent=n;$('sum').textContent=s;$('bar').style.display=n?'flex':'none';}
function chg(k,d){cart[k]=Math.max(0,(cart[k]||0)+d);if(!cart[k])delete cart[k];render();if($('modal').style.display=='flex')openCart()}
function total(){return Object.entries(cart).reduce((a,[k,q])=>a+MENU[k].p*q,0)}
function openCart(){ if(!Object.keys(cart).length)return closeCart();
$('lines').innerHTML=Object.entries(cart).map(([k,q])=>`<div class="row"><span>${q}× ${MENU[k].n}</span><span>${q*MENU[k].p}</span></div>`).join('');$('tot').textContent=total()+' ج.م';$('modal').style.display='flex'}

const getO=()=>JSON.parse(localStorage.ashOrders||'[]');
function send(){const nm=$('nm').value.trim(),ph=$('ph').value.trim(),ty=$('ty').value,ad=$('ad').value.trim();
if(!nm||!ph)return alert('اكتب الاسم والموبايل');if(ty=='توصيل'&&!ad)return alert('اكتب العنوان');
const items=Object.entries(cart).map(([k,q])=>({n:MENU[k].n,q,p:MENU[k].p}));
const o={id:'A'+Date.now().toString().slice(-6),t:new Date().toLocaleString('ar-EG'),nm,ph,ty,ad,nt:$('nt').value.trim(),items,total:total()};
